[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teleharvester"
version = "2.2.0"
description = "Multi-account Telegram automation toolkit: aiogram control bot, channel scraper and session scripts"
requires-python = ">=3.11"
# one list: requirements.txt (README installs from it)
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest", "ruff>=0.17,<0.18"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["bot*", "functions*", "modules*", "scraper*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# real errors (undefined names, unused imports) and the line length; no other style
select = ["F", "E501"]

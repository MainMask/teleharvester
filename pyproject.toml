[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teleharvester"
version = "2.2.0"
description = "Multi-account Telegram automation toolkit: terminal menu, aiogram control bot, and channel scraper"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.45,<2",
    "aiogram>=3.31,<4",
    "rich>=15,<16",
    "gitpython>=3.1,<4",
    "phonenumbers>=9,<10",
    "python-socks[asyncio]>=3.1,<4",
    "pandas>=3,<4",
    "numpy>=2,<3",
    "tqdm>=4.70,<5",
    "pyarrow>=25,<26",
    "openpyxl>=3.1,<4",
    "python-dotenv>=1.2,<2",
    "toml>=0.10,<1",
    "opentele-ng>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
scraper = "scraper.cli:main"

[tool.setuptools.packages.find]
include = ["bot*", "functions*", "modules*", "scraper*"]
exclude = ["tests*"]
